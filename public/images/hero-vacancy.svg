<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="hvTitle hvDesc">
  <title id="hvTitle">Job vacancy</title>
  <desc id="hvDesc">A teal megaphone announcing a "job vacancy" sign over a sunburst and a city skyline.</desc>

  <defs>
    <!-- Warm burst behind the megaphone -->
    <radialGradient id="hvGlow" cx="36%" cy="54%" r="60%">
      <stop offset="0%" stop-color="#fff8e1" stop-opacity="0.85" />
      <stop offset="55%" stop-color="#ffd75e" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#ffd75e" stop-opacity="0" />
    </radialGradient>

    <!-- Building windows -->
    <pattern id="hvWin" width="26" height="34" patternUnits="userSpaceOnUse">
      <rect x="5" y="7" width="12" height="16" rx="2" fill="#ffd34d" opacity="0.85" />
    </pattern>

    <!-- Bottom shading for depth -->
    <linearGradient id="hvFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b3f52" stop-opacity="0" />
      <stop offset="100%" stop-color="#0b3f52" stop-opacity="0.28" />
    </linearGradient>

    <!-- Reusable sun ray (half-width 7deg, reaching past every corner) -->
    <path id="hvRay" d="M0,0 L1191,-146 L1191,146 Z" />

    <!-- Reusable 4-point sparkle -->
    <path id="hvSpark" d="M0,-1 L0.2,-0.2 L1,0 L0.2,0.2 L0,1 L-0.2,0.2 L-1,0 L-0.2,-0.2 Z" />
  </defs>

  <!-- Sky: teal base + yellow / orange sunburst -->
  <rect width="1200" height="800" fill="#12a9a5" />
  <g>
    <use href="#hvRay" transform="translate(380,420) rotate(0)" fill="#ffc93c" />
    <use href="#hvRay" transform="translate(380,420) rotate(20)" fill="#ff9e2c" />
    <use href="#hvRay" transform="translate(380,420) rotate(40)" fill="#ffc93c" />
    <use href="#hvRay" transform="translate(380,420) rotate(60)" fill="#ff9e2c" />
    <use href="#hvRay" transform="translate(380,420) rotate(80)" fill="#ffc93c" />
    <use href="#hvRay" transform="translate(380,420) rotate(100)" fill="#ff9e2c" />
    <use href="#hvRay" transform="translate(380,420) rotate(120)" fill="#ffc93c" />
    <use href="#hvRay" transform="translate(380,420) rotate(140)" fill="#ff9e2c" />
    <use href="#hvRay" transform="translate(380,420) rotate(160)" fill="#ffc93c" />
    <use href="#hvRay" transform="translate(380,420) rotate(180)" fill="#ff9e2c" />
    <use href="#hvRay" transform="translate(380,420) rotate(200)" fill="#ffc93c" />
    <use href="#hvRay" transform="translate(380,420) rotate(220)" fill="#ff9e2c" />
    <use href="#hvRay" transform="translate(380,420) rotate(240)" fill="#ffc93c" />
    <use href="#hvRay" transform="translate(380,420) rotate(260)" fill="#ff9e2c" />
    <use href="#hvRay" transform="translate(380,420) rotate(280)" fill="#ffc93c" />
    <use href="#hvRay" transform="translate(380,420) rotate(300)" fill="#ff9e2c" />
    <use href="#hvRay" transform="translate(380,420) rotate(320)" fill="#ffc93c" />
    <use href="#hvRay" transform="translate(380,420) rotate(340)" fill="#ff9e2c" />
  </g>
  <circle cx="400" cy="430" r="360" fill="url(#hvGlow)" />

  <!-- Sparkles -->
  <g fill="#fff6c0">
    <use href="#hvSpark" transform="translate(150,150) scale(30)" />
    <use href="#hvSpark" transform="translate(1055,135) scale(34) rotate(22)" fill="#ffffff" />
    <use href="#hvSpark" transform="translate(985,585) scale(24) rotate(-14)" />
    <use href="#hvSpark" transform="translate(112,655) scale(22) rotate(10)" fill="#ffffff" />
    <use href="#hvSpark" transform="translate(905,215) scale(17)" />
    <use href="#hvSpark" transform="translate(1155,430) scale(19)" fill="#ffffff" />
    <use href="#hvSpark" transform="translate(300,92) scale(17)" />
    <use href="#hvSpark" transform="translate(668,118) scale(13)" fill="#ffffff" />
    <use href="#hvSpark" transform="translate(560,690) scale(18) rotate(12)" />
  </g>


  <!-- City skyline -->
  <g>
    <path fill="#16407a" d="M0 590 h100 v210 h-100 z M105 620 h70 v180 h-70 z M180 530 h85 v270 h-85 z M270 640 h65 v160 h-65 z M340 560 h95 v240 h-95 z M440 610 h75 v190 h-75 z M520 490 h90 v310 h-90 z M615 630 h70 v170 h-70 z M690 565 h105 v235 h-105 z M800 645 h60 v155 h-60 z M865 520 h85 v280 h-85 z M955 610 h75 v190 h-75 z M1035 480 h90 v320 h-90 z M1130 590 h80 v210 h-80 z M1215 630 h60 v170 h-60 z" />
    <path fill="url(#hvWin)" d="M0 590 h100 v210 h-100 z M105 620 h70 v180 h-70 z M180 530 h85 v270 h-85 z M270 640 h65 v160 h-65 z M340 560 h95 v240 h-95 z M440 610 h75 v190 h-75 z M520 490 h90 v310 h-90 z M615 630 h70 v170 h-70 z M690 565 h105 v235 h-105 z M800 645 h60 v155 h-60 z M865 520 h85 v280 h-85 z M955 610 h75 v190 h-75 z M1035 480 h90 v320 h-90 z M1130 590 h80 v210 h-80 z M1215 630 h60 v170 h-60 z" />
    <path fill="#2c6fb8" d="M0 590 h22 v210 h-22 z M180 530 h20 v270 h-20 z M340 560 h22 v240 h-22 z M520 490 h22 v310 h-22 z M690 565 h24 v235 h-24 z M865 520 h22 v280 h-22 z M1035 480 h22 v320 h-22 z M1130 590 h20 v210 h-20 z" />
  </g>
  <rect y="560" width="1200" height="240" fill="url(#hvFloor)" />

  <!-- Megaphone (points up-right) -->
  <ellipse cx="392" cy="646" rx="220" ry="26" fill="#0b3f52" opacity="0.18" />
  <g transform="translate(370,480) rotate(-24)" stroke="#0b3f52" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <!-- Grip -->
    <rect x="-34" y="38" width="36" height="112" rx="14" fill="#1490ab" />
    <rect x="-14" y="58" width="8" height="72" rx="4" fill="#0e5c74" stroke="none" />
    <!-- Trigger -->
    <rect x="6" y="40" width="46" height="16" rx="8" fill="#0e5c74" />
    <!-- Body -->
    <rect x="-60" y="-42" width="172" height="92" rx="18" fill="#29a8c7" />
    <!-- Gold band -->
    <rect x="58" y="-42" width="36" height="92" fill="#f2b01e" />
    <!-- Bell -->
    <path d="M105 -46 L250 -116 L250 116 L105 46 Z" fill="#2fb2d0" />
    <!-- Bell mouth -->
    <ellipse cx="250" cy="0" rx="27" ry="116" fill="#157e99" />
    <ellipse cx="254" cy="0" rx="16" ry="98" fill="#0e5c74" stroke="none" />
    <!-- Rivets -->
    <circle cx="-30" cy="-30" r="6" fill="#0e5c74" stroke="none" />
    <circle cx="-30" cy="30" r="6" fill="#0e5c74" stroke="none" />
  </g>

  <!-- Bracket linking horn to the sign -->
  <path d="M596 380 L672 352" stroke="#0b3f52" stroke-width="22" stroke-linecap="round" fill="none" />

  <!-- "job vacancy" sign -->
  <g transform="rotate(-8 814 335)">
    <rect x="643" y="245" width="372" height="206" rx="30" fill="#0b3f52" opacity="0.35" />
    <rect x="628" y="232" width="372" height="206" rx="30" fill="#ffd24d" stroke="#17315e" stroke-width="13" />
    <g fill="#17315e" text-anchor="middle" font-family="'Arial Black','Segoe UI Black',Impact,Haettenschweiler,sans-serif" font-weight="900">
      <text x="814" y="322" font-size="70" letter-spacing="1">job</text>
      <text x="814" y="404" font-size="70" letter-spacing="1">vacancy</text>
    </g>
  </g>
</svg>
